[package]
name = "wallet-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
argon2 = "0.6.0"
bdk_bitcoind_rpc = "0.22.0"
bdk_wallet = { version = "3.2.0", features = ["rusqlite", "keys-bip39"] }
bip39 = { version = "2.2.2", features = ["zeroize"] }
bitcoincore-rpc = "0.19.0"
chacha20poly1305 = "0.11.0"
dotenvy = "0.15.7"
governor = "0.10.4"
payjoin = { version = "1.1.0", features = ["v2", "v1", "io", "rustls"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
toml = "1.1.6"
tracing = "0.1.44"
ulid = "3.0.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
uuid = { version = "1.26.1", features = ["v4"] }
zeroize = "1.9.0"

[dev-dependencies]
corepc-node = { version = "0.12.0", features = ["29_0", "download"] }
httpmock = "0.8.2"
tempfile = "3.27.0"
